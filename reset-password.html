<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#261307">
  <title>Reset Password | Youth Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brand-theme.css">
  <link rel="stylesheet" href="css/service-requests.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="brand-logo"><a href="index.html" class="logo-text">Youth<span>Portal</span><i aria-hidden="true">.</i></a></div>
      <nav class="nav-menu" aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="opportunities.html" class="nav-link">Explore Opportunities</a></li>
          <li><a href="resources.html" class="nav-link">Career Resources</a></li>
          <li><a href="contact.html" class="nav-link">Contact &amp; Report</a></li>
        </ul>
        <div class="nav-actions"><a href="login.html" class="btn-primary">Log in</a><a href="signup.html" class="btn-secondary">Sign up</a></div>
      </nav>
    </div>
  </header>
  <main class="auth-container">
    <div class="auth-card">
      <p class="section-kicker">Account access</p>
      <h2>Choose a new password</h2>
      <p class="auth-sub">Reset links expire after 30 minutes and can be used once.</p>
      <form id="reset-password-form">
        <div class="form-group">
          <label for="reset-password">New password</label>
          <input id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}" title="Use at least 8 characters with an uppercase letter, lowercase letter, and number." required>
        </div>
        <div class="form-group">
          <label for="reset-password-confirmation">Confirm new password</label>
          <input id="reset-password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" class="btn-primary auth-btn">Reset password</button>
      </form>
      <p class="auth-footer-text"><a href="login.html">Back to login</a></p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
