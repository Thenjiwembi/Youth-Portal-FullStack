<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#261307">
  <title>Verify Email | Youth Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/brand-theme.css">
  <link rel="stylesheet" href="css/service-requests.css">
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <div class="brand-logo"><a href="index.html" class="logo-text">Youth<span>Portal</span><i aria-hidden="true">.</i></a></div>
      <nav class="nav-menu" aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="opportunities.html" class="nav-link">Explore Opportunities</a></li>
          <li><a href="resources.html" class="nav-link">Career Resources</a></li>
          <li><a href="contact.html" class="nav-link">Contact &amp; Report</a></li>
        </ul>
        <div class="nav-actions"><a href="login.html" class="btn-primary">Log in</a><a href="signup.html" class="btn-secondary">Sign up</a></div>
      </nav>
    </div>
  </header>
  <main class="auth-container">
    <div class="auth-card">
      <p class="section-kicker">Confirm your email</p>
      <h2>Verify your account</h2>
      <p class="auth-sub">Enter the six-digit code sent to your email address. Codes expire after 10 minutes.</p>
      <form id="verify-email-form">
        <div class="form-group">
          <label for="verify-email-address">Email address</label>
          <input id="verify-email-address" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="form-group">
          <label for="verify-email-code">Verification code</label>
          <input id="verify-email-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        </div>
        <button type="submit" class="btn-primary auth-btn">Verify email</button>
        <button type="button" class="btn-secondary auth-btn" id="resend-verification-code">Send a new code</button>
      </form>
      <p class="auth-footer-text"><a href="login.html">Back to login</a></p>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
